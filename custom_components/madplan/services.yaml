ny_plan:
  fields:
    entity_id: &madplan
      selector:
        entity:
          integration: madplan
          domain: sensor
    handler:
      example: "i_morgen"
      selector:
        select:
          options: ["i_dag", "i_morgen"]
byt_ret:
  fields:
    entity_id: *madplan
    dag: &dag
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 7
fjern_ret:
  fields:
    entity_id: *madplan
    dag: *dag
overfoer:
  fields:
    til:
      selector:
        select:
          options:
            - liste
            - rema
    entity_id: *madplan
tilfoej_behov:
  fields:
    entity_id: *madplan
    tekst: &tekst
      required: true
      example: "pålæg"
      selector:
        text:
          multiple: true
fjern_behov:
  fields:
    entity_id: *madplan
    tekst:
      required: true
      example: "pålæg"
      selector:
        text:
ekstra_antal:
  fields:
    entity_id: *madplan
    uid:
      required: true
      selector:
        text:
    antal:
      required: true
      selector:
        number:
          min: 1
          max: 50
gem_regler:
  fields:
    entity_id:
      selector:
        entity:
          integration: madplan
          domain: sensor
    budget:
      example: 700
      selector:
        number:
          min: 0
          max: 10000
          unit_of_measurement: kr
    oeko:
      selector:
        boolean:
    allergier:
      example: ["nødder"]
      selector:
        text:
          multiple: true
    undgaa:
      example: ["svampe"]
      selector:
        text:
          multiple: true
    favoritter:
      example: ["lasagne"]
      selector:
        text:
          multiple: true
    vegetar:
      selector:
        number:
          min: 0
          max: 7
    fisk:
      selector:
        number:
          min: 0
          max: 7
    max_tid:
      selector:
        number:
          min: 10
          max: 180
          unit_of_measurement: min
    max_tid_weekend:
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: min
    husstand:
      selector:
        select:
          options: ["boernefamilie", "voksne"]
    koekkener:
      example: ["italiensk", "asiatisk"]
      selector:
        text:
          multiple: true
    faste_dage:
      example: '[{"dag": 5, "ret": "pizza"}]'
      selector:
        object:
    niveau:
      selector:
        select:
          options: ["hverdag", "hygge", "gourmet"]
    min_varer_ekstra:
      selector:
        number:
          min: 1
          max: 5
    mine_hyppighed:
      selector:
        select:
          options: ["aldrig", "nogle", "ofte"]
    kcal:
      selector:
        number:
          min: 200
          max: 2000
          unit_of_measurement: kcal
    protein:
      selector:
        number:
          min: 5
          max: 150
          unit_of_measurement: g
    krav:
      example: "Frilandsæg og økologisk mælk"
      selector:
        text:
          multiline: true
marker:
  fields:
    entity_id: *madplan
    liste:
      required: true
      selector:
        select:
          options: ["varer", "ekstra"]
    uid:
      required: true
      selector:
        text:
    felt:
      required: true
      selector:
        select:
          options: ["kurv", "hjemme"]
    vaerdi:
      required: true
      selector:
        boolean:
toem_kurv:
  fields:
    entity_id: *madplan
dag_personer:
  fields:
    entity_id: *madplan
    dag: *dag
    personer:
      required: true
      example: 8
      selector:
        number:
          min: 0
          max: 30
en_ret:
  fields:
    entity_id: *madplan
    har:
      example: ["kylling", "peberfrugt", "ris"]
      selector:
        text:
          multiple: true
    personer:
      selector:
        number:
          min: 1
          max: 30
    oenske:
      example: "noget asiatisk"
      selector:
        text:
slet_en_ret:
  fields:
    entity_id: *madplan
    id: &en_id
      required: true
      selector:
        text:
en_ret_paa_listen:
  fields:
    entity_id: *madplan
    id: *en_id
en_ret_mail:
  fields:
    entity_id: *madplan
    id: *en_id
dag_mail:
  fields:
    entity_id: *madplan
    dag: *dag
rester:
  fields:
    entity_id: *madplan
    dag: *dag
    til:
      default: true
      selector:
        boolean:
ekstra_butikker:
  fields:
    entity_id: *madplan
    butikker:
      required: true
      example: ["netto"]
      selector:
        select:
          multiple: true
          options: ["rema1000", "netto", "foetex", "bilka", "lidl", "365discount", "kvickly", "superbrugsen", "brugsen", "meny", "spar", "lovbjerg", "min_kobmand", "abc_lavpris"]
auto_plan:
  fields:
    entity_id: *madplan
    til:
      required: true
      selector:
        boolean:
gem_min_ret:
  fields:
    entity_id:
      selector:
        entity:
          integration: madplan
          domain: sensor
    id:
      selector:
        text:
    navn:
      example: "Lasagne"
      selector:
        text:
    aktiv:
      selector:
        boolean:
    dage:
      selector:
        number:
          min: 1
          max: 2
    portioner:
      selector:
        number:
          min: 1
          max: 30
    link:
      selector:
        text:
          type: url
    noter:
      selector:
        text:
          multiline: true
    ingredienser:
      example: "500 g hakket oksekød\n1 dåse hakkede tomater\n12 lasagneplader"
      selector:
        text:
          multiline: true
    fremgangsmaade:
      selector:
        text:
          multiline: true
slet_min_ret:
  fields:
    entity_id:
      selector:
        entity:
          integration: madplan
          domain: sensor
    id:
      required: true
      selector:
        text:
hent_min_ret:
  fields:
    entity_id:
      selector:
        entity:
          integration: madplan
          domain: sensor
    id:
      required: true
      selector:
        text:

